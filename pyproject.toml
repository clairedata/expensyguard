[project]
name = "expensyguard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "clairedata", email = "clairedata2026@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "easyocr>=1.7.2",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "openai>=3.24.0",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[project.scripts]
expensyguard = "expensyguard:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
